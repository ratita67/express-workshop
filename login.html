<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pokédex</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">Iniciar Sesión</h2>
                <form>
                    <div class="mb-3">
                        <label for="input_mail" class="form-label">Correo electrónico</label>
                        <!-- ID corregido para coincidir con login.js -->
                        <input type="email" class="form-control" id="input_mail" placeholder="usuario@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label for="input_password" class="form-label">Contraseña</label>
                        <!-- ID corregido para coincidir con login.js -->
                        <input type="password" class="form-control" id="input_password" placeholder="********">
                    </div>
                    <!-- Botones con clases de Bootstrap -->
                    <button type="button" class="btn btn-primary w-100">Entrar</button>
                    <button type="button" class="btn btn-secondary w-100 mt-2">Registro</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts necesarios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- AQUÍ SE CARGA TU LÓGICA -->
    <script src="./js/login.js"></script>
</body>
</html>s
